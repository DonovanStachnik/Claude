<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Opportunity Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #1e2139;
        }

        h1 {
            font-size: 2.5em;
            color: #00ff88;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: #1a1d35;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #2a2d45;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00ff88;
            margin: 10px 0;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .opportunities {
            margin-top: 40px;
        }

        .opp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .opp-header h2 {
            color: #fff;
            font-size: 1.8em;
        }

        .refresh-btn {
            background: #00ff88;
            color: #0a0e27;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #00dd70;
            transform: translateY(-2px);
        }

        .opp-card {
            background: #1a1d35;
            border: 1px solid #2a2d45;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .opp-card:hover {
            border-color: #00ff88;
            transform: translateX(5px);
        }

        .opp-card.strong-buy {
            border-left: 4px solid #00ff88;
        }

        .opp-card.buy {
            border-left: 4px solid #00aaff;
        }

        .opp-card.sell {
            border-left: 4px solid #ff4444;
        }

        .opp-rank {
            display: inline-block;
            background: #00ff88;
            color: #0a0e27;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-right: 10px;
        }

        .opp-recommendation {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .rec-strong-buy {
            background: #00ff88;
            color: #0a0e27;
        }

        .rec-buy {
            background: #00aaff;
            color: #fff;
        }

        .rec-sell {
            background: #ff4444;
            color: #fff;
        }

        .opp-title {
            font-size: 1.4em;
            color: #fff;
            margin: 15px 0;
        }

        .opp-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
            padding: 20px;
            background: #0f1229;
            border-radius: 8px;
        }

        .meta-item {
            text-align: center;
        }

        .meta-label {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .meta-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #00ff88;
        }

        .edge-positive {
            color: #00ff88;
        }

        .edge-negative {
            color: #ff4444;
        }

        .opp-reasoning {
            color: #aaa;
            line-height: 1.6;
            margin: 15px 0;
            padding: 15px;
            background: #0f1229;
            border-radius: 8px;
            border-left: 3px solid #00ff88;
        }

        .category-badge {
            display: inline-block;
            background: #2a2d45;
            color: #00ff88;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-right: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1.2em;
        }

        .spinner {
            border: 3px solid #2a2d45;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .last-update {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: #888;
        }

        .no-data h3 {
            color: #aaa;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ KALSHI OPPORTUNITY SCANNER</h1>
            <p class="subtitle">Best Prediction Market Bets • Updated in Real-Time</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Opportunities</div>
                <div class="stat-value" id="stat-total">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Strong Buy</div>
                <div class="stat-value" id="stat-strong-buy">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Buy</div>
                <div class="stat-value" id="stat-buy">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Edge</div>
                <div class="stat-value" id="stat-edge">-</div>
            </div>
        </div>

        <div class="opportunities">
            <div class="opp-header">
                <h2>🎯 Top Opportunities</h2>
                <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
            </div>
            <div id="opportunities-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading opportunities...</p>
                </div>
            </div>
        </div>

        <div class="last-update" id="last-update"></div>
    </div>

    <script>
        function loadData() {
            // Load stats
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('stat-total').textContent = data.total_opportunities || 0;
                    document.getElementById('stat-strong-buy').textContent = data.strong_buy || 0;
                    document.getElementById('stat-buy').textContent = data.buy || 0;
                    document.getElementById('stat-edge').textContent = data.avg_edge ? data.avg_edge + '%' : '0%';
                });

            // Load opportunities
            fetch('/api/opportunities')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('opportunities-list');

                    if (!data.opportunities || data.opportunities.length === 0) {
                        container.innerHTML = `
                            <div class="no-data">
                                <h3>No opportunities found yet</h3>
                                <p>Run the scanner to analyze markets</p>
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    data.opportunities.forEach((opp, index) => {
                        const market = opp.market;
                        const analysis = opp.analysis;

                        const recClass = analysis.recommendation.toLowerCase().replace('_', '-');
                        const edgeClass = analysis.edge > 0 ? 'edge-positive' : 'edge-negative';

                        html += `
                            <div class="opp-card ${recClass}">
                                <div>
                                    <span class="opp-rank">#${index + 1}</span>
                                    <span class="opp-recommendation rec-${recClass}">${analysis.recommendation.replace('_', ' ')}</span>
                                    <span class="category-badge">${analysis.category}</span>
                                </div>

                                <div class="opp-title">${market.title}</div>

                                <div class="opp-meta">
                                    <div class="meta-item">
                                        <div class="meta-label">Market Price</div>
                                        <div class="meta-value">${analysis.market_probability.toFixed(1)}%</div>
                                    </div>
                                    <div class="meta-item">
                                        <div class="meta-label">True Probability</div>
                                        <div class="meta-value">${analysis.true_probability.toFixed(1)}%</div>
                                    </div>
                                    <div class="meta-item">
                                        <div class="meta-label">Edge</div>
                                        <div class="meta-value ${edgeClass}">${analysis.edge > 0 ? '+' : ''}${analysis.edge.toFixed(1)}%</div>
                                    </div>
                                    <div class="meta-item">
                                        <div class="meta-label">Confidence</div>
                                        <div class="meta-value">${analysis.confidence.toFixed(0)}%</div>
                                    </div>
                                </div>

                                <div class="opp-reasoning">
                                    <strong>Analysis:</strong> ${analysis.reasoning}
                                </div>

                                <div style="margin-top: 15px; color: #666; font-size: 0.85em;">
                                    Ticker: ${market.ticker}
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = html;

                    // Update last update time
                    if (data.timestamp) {
                        document.getElementById('last-update').textContent =
                            `Last updated: ${new Date(data.timestamp).toLocaleString()}`;
                    }
                });
        }

        // Load data on page load
        loadData();

        // Auto-refresh every 60 seconds
        setInterval(loadData, 60000);
    </script>
</body>
</html>
